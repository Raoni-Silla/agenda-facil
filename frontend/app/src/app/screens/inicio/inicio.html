<div class="containerTitulos">
  <h1><span class="tituloPrincipal">Bem-Vindo de volta!</span></h1>
  <p><span class="subtituloPrincipal">Seus agendamentos de hoje</span></p>
</div>
<div class="gridCard">
  <app-card-estatisticas titulo="Hoje" [valor]="agendamentosHoje()"></app-card-estatisticas>
  <app-card-estatisticas
    titulo="Semana"
    [valor]="agendamentosSemana()"
    icone="fa fa-clock"
  ></app-card-estatisticas>
  <app-card-estatisticas
    titulo="Clientes"
    [valor]="totalClientes()"
    icone="fa fa-users"
  ></app-card-estatisticas>
  <app-card-estatisticas
    titulo="Total Ganho"
    [valor]="totalGanho()"
    icone="fas fa-chart-line"
  ></app-card-estatisticas>
  <app-card-estatisticas
    titulo="Faturamento"
    [valor]="faturamento()"
    icone="fas fa-hand-holding-usd"
  ></app-card-estatisticas>
</div>
<div class="proximosAgendamentos">
  <div class="headerProximoAgendamento">
    <h2>Agendamentos Para Hoje</h2>
    <button routerLink="/agenda">Ver Todos <i class="fa fa-arrow-right"></i></button>
  </div>
  
  @for (agendamento of proximosAgendamentos(); track agendamento.idAgendamento) {
    <div>
      <app-card-agendamento
        [nomeCliente]="agendamento.cliente.nome"
        [servico]="agendamento.itens[0]?.servico?.nome || 'Sem serviço'"
        [horas]="formatarHora(agendamento.horaInicio)"
        abreviacao="RS"
      ></app-card-agendamento>
    </div>
  } @empty {
    <p>Sem agendamentos para hoje</p>
  }
</div>

<div class="gridBotao">
  <app-card-botao
    tema="gradiente"
    icone="fa-calendar-plus"
    titulo="Novo Agendamento"
    subtitulo="Adicionar cliente"
    rota="/criarAgendamento"
  >
  </app-card-botao>

  <app-card-botao
    tema="claro"
    icone="fa-clock"
    titulo="Ver Calendário"
    subtitulo="Visão completa do mês"
    routerLink="/calendario"
  >
  </app-card-botao>
</div>
