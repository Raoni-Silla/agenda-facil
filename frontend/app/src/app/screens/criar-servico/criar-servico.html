<div class="avo">
  <div class="mae">
    <div class="cabecalho">
      <a [routerLink]="['/servicos']"><i class="fa fa-arrow-left"></i></a>
      <h1>Novo Serviço</h1>
    </div>

    <form class="corpo">
      
      <div class="form-group">
        <label for="nome">
          <i class="fa fa-scissors"></i> Nome do Serviço
        </label>
        <input 
          type="text" 
          name="nome" 
          id="nome" 
          placeholder="Ex: Corte Degradê" 
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="valor">
            <i class="fa fa-dollar-sign"></i> Valor (R$)
          </label>
          <input
            type="text"
            name="valor"
            id="valor"
            placeholder="00,00"
          />
        </div>

        <div class="form-group" style="margin-top: 20px;">
          <label for="tempo">
            <i class="fa fa-clock"></i> Duração (min)
          </label>
          <input
            type="number"
            name="tempo"
            id="tempo"
            placeholder="30"
          />
        </div>
      </div>

      <div class="botoes-acao">
        <button type="button" class="btn-cancelar" [routerLink]="['/servicos']">
          Cancelar
        </button>

        <button type="submit" class="btn-salvar">
          <i class="fa fa-save"></i> Salvar Serviço
        </button>
      </div>
    </form>
  </div>
</div>
